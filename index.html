<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriRent Hub - Startup AgriTech Super Platform</title>
  
  <!-- CSS CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind Configuration for Rich Aesthetics -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            accent: {
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
            },
            dark: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #020617;
      color: #f1f5f9;
      font-family: 'Outfit', sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(34, 197, 94, 0.3);
      box-shadow: 0 10px 30px -10px rgba(34, 197, 94, 0.15);
      transform: translateY(-2px);
    }
    .scrollbar-hidden::-webkit-scrollbar {
      display: none;
    }
    /* Simple dynamic wave animation for audio notes */
    .voice-bar {
      animation: wave 1.2s ease-in-out infinite alternate;
    }
    @keyframes wave {
      0% { height: 4px; }
      100% { height: 24px; }
    }
  </style>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Leaflet & Lucide Icons CDNs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-950 min-h-screen antialiased text-slate-100 selection:bg-primary-500/30 selection:text-primary-100">

  <div id="root"></div>

  <!-- React Application Core Component -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Hardcoded dataset representing the product features
    const initialTools = [
      { id: 1, name: 'Mahindra Arjun Novo 605', category: 'Tractor', power: '57 HP', rentRates: { daily: 1500, weekly: 9000, monthly: 32000 }, location: [28.6250, 77.2150], images: 'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&q=80&w=400', rating: 4.8, owner: 'Rajesh Kumar' },
      { id: 2, name: 'Rotavator Shaktiman 8 Feet', category: 'Rotavator', power: 'Fits 50+ HP', rentRates: { daily: 800, weekly: 4800, monthly: 16000 }, location: [28.6180, 77.1950], images: 'https://images.unsplash.com/photo-1595273670150-db0a3e39843c?auto=format&fit=crop&q=80&w=400', rating: 4.6, owner: 'Satnam Singh' },
      { id: 3, name: 'Pneumatic Precision Seeder', category: 'Seeder', power: 'Precision Row', rentRates: { daily: 1200, weekly: 7200, monthly: 24000 }, location: [28.6320, 77.2340], images: 'https://images.unsplash.com/photo-1622383563227-04401ab4e5ea?auto=format&fit=crop&q=80&w=400', rating: 4.9, owner: 'Suresh Patel' },
      { id: 4, name: 'John Deere Combines W70', category: 'Harvester', power: '100 HP', rentRates: { daily: 5000, weekly: 30000, monthly: 110000 }, location: [28.5950, 77.2210], images: 'https://images.unsplash.com/photo-1530906358829-e84b2769270f?auto=format&fit=crop&q=80&w=400', rating: 4.7, owner: 'Gurbaksh Singh' }
    ];

    const initialSeeds = [
      { id: 1, name: 'Kanak Wheat Seeds HD-3086', price: 450, category: 'Wheat Seeds', rating: 4.8, stock: 24, images: 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&q=80&w=200' },
      { id: 2, name: 'Basmati Paddy Seeds 1121', price: 650, category: 'Rice Seeds', rating: 4.9, stock: 15, images: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=200' },
      { id: 3, name: 'Hybrid Hybrid Sweet Corn', price: 320, category: 'Corn Seeds', rating: 4.5, stock: 40, images: 'https://images.unsplash.com/photo-1551754655-cd27e38d20f6?auto=format&fit=crop&q=80&w=200' }
    ];

    const initialFertilizers = [
      { id: 1, name: 'Bio-Organic Compost Humus', price: 280, category: 'Organic', rating: 4.7, stock: 80, images: 'https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&q=80&w=200' },
      { id: 2, name: 'Granular Urea (46% Nitrogen)', price: 350, category: 'Urea', rating: 4.4, stock: 50, images: 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&q=80&w=200' },
      { id: 3, name: 'Diammonium Phosphate (DAP)', price: 980, category: 'DAP', rating: 4.6, stock: 22, images: 'https://images.unsplash.com/photo-1599599810769-bcde5a160d32?auto=format&fit=crop&q=80&w=200' }
    ];

    const initialCrops = [
      { id: 1, cropName: 'Golden Wheat Bumper Harvest', price: 2150, unit: 'Quintal', quantity: 50, farmer: 'Ram Singh', location: 'Ludhiana, Punjab', images: 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&q=80&w=250' },
      { id: 2, cropName: 'Premium Basmati Paddy Rice', price: 4200, unit: 'Quintal', quantity: 30, farmer: 'Devendra Hooda', location: 'Karnal, Haryana', images: 'https://images.unsplash.com/photo-1536304997881-a372c179924b?auto=format&fit=crop&q=80&w=250' }
    ];

    function App() {
      // States
      const [activeTab, setActiveTab] = useState('landing');
      const [role, setRole] = useState('Farmer');
      const [user, setUser] = useState({ name: 'Ramesh Patel', coins: 120, xp: 80, badge: 'Beginner Farmer', kycStatus: 'Not Submitted' });
      const [language, setLanguage] = useState('en');
      
      // Marketplace / Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [distanceFilter, setDistanceFilter] = useState(50);
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [comparisonList, setComparisonList] = useState([]);
      
      // booking
      const [selectedTool, setSelectedTool] = useState(initialTools[0]);
      const [bookingStartDate, setBookingStartDate] = useState('');
      const [bookingEndDate, setBookingEndDate] = useState('');
      const [bookings, setBookings] = useState([
        { id: 1, toolName: 'Mahindra Arjun Novo 605', startDate: '2026-06-14', endDate: '2026-06-16', total: 4500, status: 'Approved' }
      ]);
      const [selectedView, setSelectedView] = useState('monthly');
      const [bookingFilterStatus, setBookingFilterStatus] = useState('All');

      // AI States
      const [priceInputs, setPriceInputs] = useState({ crop: 'Wheat', state: 'Punjab', district: 'Ludhiana', season: 'Rabi' });
      const [pricePrediction, setPricePrediction] = useState(null);
      const [priceModel, setPriceModel] = useState('Linear Regression');
      const [aiDiagnosisCrop, setAiDiagnosisCrop] = useState('Wheat');
      const [aiDiagnosisResult, setAiDiagnosisResult] = useState(null);
      const [diseaseModel, setDiseaseModel] = useState('CNN');
      const [gamifiedChallenge, setGamifiedChallenge] = useState('quiz'); // 'quiz', 'disease', 'fertilizer'
      const [aiAdvisorMessage, setAiAdvisorMessage] = useState('');
      const [aiAdvisorLogs, setAiAdvisorLogs] = useState([
        { sender: 'AI', text: 'Hello! I am your AI Agronomist. Ask me anything in English, Hindi, or Hinglish.' }
      ]);
      const [isRecording, setIsRecording] = useState(false);

      // Chat Messages
      const [chatLog, setChatLog] = useState([
        { sender: 'Rajesh Kumar (Owner)', message: 'Hello Ramesh, the Mahindra tractor is fully serviced and ready for your farm.', time: '10:30 AM', image: '', voiceNote: false },
        { sender: 'Me', message: 'Perfect! I will schedule the pickup for tomorrow morning.', time: '10:32 AM', image: '', voiceNote: false }
      ]);
      const [chatInput, setChatInput] = useState('');

      // Gamification Quiz
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);

      // KYC
      const [aadhaarInput, setAadhaarInput] = useState('');
      const [kycType, setKycType] = useState('Farmer');
      const [kycRecords, setKycRecords] = useState([
        { id: 1, name: 'Sohan Lal', role: 'Tool Owner', aadhaar: '884930219483', status: 'Pending' },
        { id: 2, name: 'Sanjay Dutt', role: 'Shopkeeper', aadhaar: '394820194820', status: 'Pending' }
      ]);

      // Crop selling farmer inputs
      const [newCropName, setNewCropName] = useState('');
      const [newCropPrice, setNewCropPrice] = useState('');
      const [newCropQuantity, setNewCropQuantity] = useState('');
      const [newCropUnit, setNewCropUnit] = useState('kg');
      const [newCropLocation, setNewCropLocation] = useState('');

      // Map Setup
      const mapContainerRef = useRef(null);
      const mapInstance = useRef(null);

      // Translation dictionary
      const t = (key) => {
        const trans = {
          en: {
            heroTitle: 'Modern Farming, Shared Abundance',
            heroSubtitle: 'Rent premium machinery, buy certified seeds/fertilizers, sell crops directly, and receive real-time AI agricultural advisory.',
            rentNow: 'Rent Now', buyNow: 'Buy Now', sellCrop: 'Sell Crop',
            diseaseDetect: 'Disease Detector', pricePredict: 'Price Predictor',
            aiAssistant: 'AI Agronomist', dailyQuiz: 'Daily Quiz',
            leaderboard: 'Leaderboard', searchPlaceholder: 'Search for tractors, seeds, crops...'
          },
          hi: {
            heroTitle: 'आधुनिक खेती, साझा समृद्धि',
            heroSubtitle: 'प्रीमियम उपकरण किराए पर लें, उच्च गुणवत्ता वाले बीज/खाद खरीदें, फसलें बेचें, और तुरंत एआई कृषि सलाह प्राप्त करें।',
            rentNow: 'किराए पर लें', buyNow: 'अभी खरीदें', sellCrop: 'फसल बेचें',
            diseaseDetect: 'रोग पहचान', pricePredict: 'मंडी भाव अनुमान',
            aiAssistant: 'एआई कृषि मित्र', dailyQuiz: 'दैनिक प्रश्नोत्तरी',
            leaderboard: 'रैंकिंग सूची', searchPlaceholder: 'ट्रैक्टर, कल्टीवेटर, बीज की खोज करें...'
          },
          hinglish: {
            heroTitle: 'Modern Farming, Shared Abundance',
            heroSubtitle: 'Machinery rent pe lein, certified seed/fertilizer kharidein, crop direct bechein aur expert AI advisory payein.',
            rentNow: 'Rent Pe Lein', buyNow: 'Abhi Buy Karein', sellCrop: 'Crop Bechein',
            diseaseDetect: 'Disease Scanner', pricePredict: 'Price Predictor',
            aiAssistant: 'AI Agronomist', dailyQuiz: 'Daily Quiz Game',
            leaderboard: 'Leaderboard Board', searchPlaceholder: 'Tractor, seeds, fertilizers search karein...'
          }
        };
        return trans[language][key] || key;
      };

      // Speak function using speechSynthesis
      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = language === 'hi' ? 'hi-IN' : 'en-US';
          window.speechSynthesis.speak(utterance);
        }
      };

      // Voice commands
      const startVoiceSearch = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Speech Recognition not supported in this browser. Please use Google Chrome.');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = language === 'hi' ? 'hi-IN' : 'en-US';
        setIsRecording(true);

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setSearchQuery(transcript);
          setIsRecording(false);
          speakText(language === 'hi' ? `खोजा जा रहा है ${transcript}` : `Searching for ${transcript}`);
          
          // Auto route checks based on transcript
          if (transcript.toLowerCase().includes('tractor') || transcript.toLowerCase().includes('ट्रैक्टर')) {
            setActiveTab('tools');
          } else if (transcript.toLowerCase().includes('seed') || transcript.toLowerCase().includes('बीज') || transcript.toLowerCase().includes('fertilizer') || transcript.toLowerCase().includes('खाद')) {
            setActiveTab('shop');
          } else if (transcript.toLowerCase().includes('disease') || transcript.toLowerCase().includes('रोग')) {
            setActiveTab('disease');
          } else if (transcript.toLowerCase().includes('price') || transcript.toLowerCase().includes('भाव')) {
            setActiveTab('price');
          }
        };

        recognition.onerror = () => {
          setIsRecording(false);
        };

        recognition.start();
      };

      // Booking validation & double booking prevention
      const handleBooking = (e) => {
        e.preventDefault();
        if (!bookingStartDate || !bookingEndDate) {
          alert('Please select start and end dates.');
          return;
        }

        const start = new Date(bookingStartDate);
        const end = new Date(bookingEndDate);

        if (start >= end) {
          alert('End date must be after start date.');
          return;
        }

        // Check date overlap
        const isOverlapping = bookings.some(b => {
          if (b.toolName !== selectedTool.name || b.status === 'Rejected') return false;
          const bStart = new Date(b.startDate);
          const bEnd = new Date(b.endDate);
          return start <= bEnd && end >= bStart;
        });

        if (isOverlapping) {
          alert('Error: This machine is already booked or has a pending request during the selected dates. Please check the calendar.');
          return;
        }

        const days = Math.round((end - start) / (1000 * 60 * 60 * 24));
        const rate = selectedTool.rentRates.daily;
        const total = days * rate;

        const newBooking = {
          id: bookings.length + 1,
          toolName: selectedTool.name,
          startDate: bookingStartDate,
          endDate: bookingEndDate,
          total,
          status: 'Pending'
        };

        setBookings([newBooking, ...bookings]);
        alert(`Success! Requested booking for ${selectedTool.name}. Total amount: ₹${total}`);
      };

      // AI price predictor evaluation
      const handlePricePredict = (e) => {
        e.preventDefault();
        const basePrices = { Wheat: 2125, Rice: 2183, Corn: 1960, Soybean: 4300 };
        const base = basePrices[priceInputs.crop] || 2000;
        const seasonMult = priceInputs.season === 'Rabi' ? 1.06 : priceInputs.season === 'Zaid' ? 1.10 : 0.98;

        const expected = Math.round(base * seasonMult);
        
        setPricePrediction({
          crop: priceInputs.crop,
          expected,
          min: Math.round(expected * 0.9),
          max: Math.round(expected * 1.12),
          suggestedTime: seasonMult > 1.0 ? 'Sell immediately for peak returns.' : 'Hold. Market expects stable trend.',
          confidence: '94.2%'
        });
      };

      // AI disease scanner trigger
      const runDiseaseScanner = (type) => {
        const scannerResults = {
          healthy: { name: 'Healthy Leaf Structure', confidence: '99.1%', severity: 'N/A (0%)', explanation: 'Leaf exhibits high chlorophyll activity. Keep up the organic inputs.', treatment: 'None needed.', prevention: 'Continue regular watering.' },
          rust: { name: 'Wheat Leaf Rust (Puccinia triticina)', confidence: '94.8%', severity: 'Moderate (35%)', explanation: 'Fungal leaf pathogen causing orange-brown pustules on wheat leaves, reducing yield.', treatment: 'Apply Propiconazole fungicide spray immediately.', prevention: 'Grow rust-resistant crops next season.' },
          blast: { name: 'Rice Blast blight (Magnaporthe oryzae)', confidence: '89.4%', severity: 'Severe (60%)', explanation: 'Fungal blight that produces spindle-shaped lesions on leaves.', treatment: 'Spray Tricyclazole fungicide at 1g/liter of water.', prevention: 'Treat seeds before planting.' }
        };

        setAiDiagnosisResult(scannerResults[type]);
      };

      // Chat message send
      const sendChatMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const newMsg = { sender: 'Me', message: chatInput, time: 'Just Now', image: '', voiceNote: false };
        setChatLog([...chatLog, newMsg]);
        setChatInput('');

        // Trigger AI auto-response
        setTimeout(() => {
          setChatLog(prev => [...prev, {
            sender: 'Rajesh Kumar (Owner)',
            message: 'Got it. I will keep the paperwork ready for verification.',
            time: 'Just Now',
            image: '',
            voiceNote: false
          }]);
        }, 1500);
      };

      // Chat Voice Note Simulator
      const sendVoiceNote = () => {
        setChatLog([...chatLog, {
          sender: 'Me',
          message: 'Voice Note (0:08s)',
          time: 'Just Now',
          image: '',
          voiceNote: true
        }]);
      };

      // Quiz Evaluator
      const quizQuestions = [
        { q: 'Which nutrient is primarily responsible for green color in crops?', opts: ['Nitrogen', 'Phosphorus', 'Potassium'], ans: 'Nitrogen' },
        { q: 'What is the ideal pH range for wheat farming?', opts: ['4.5 - 5.5', '6.0 - 7.0', '8.0 - 9.0'], ans: '6.0 - 7.0' },
        { q: 'Which irrigation technique saves the most water?', opts: ['Flood', 'Furrow', 'Drip'], ans: 'Drip' }
      ];

      const submitQuizOption = (opt) => {
        setSelectedOption(opt);
        if (opt === quizQuestions[quizIndex].ans) {
          setQuizScore(quizScore + 1);
        }

        setTimeout(() => {
          if (quizIndex < quizQuestions.length - 1) {
            setQuizIndex(quizIndex + 1);
            setSelectedOption(null);
          } else {
            setQuizFinished(true);
            // Award coins/XP
            const xp = quizScore * 20 + 20;
            const coins = quizScore * 10 + 10;
            setUser(prev => ({
              ...prev,
              xp: prev.xp + xp,
              coins: prev.coins + coins,
              badge: prev.xp + xp >= 100 ? 'Skilled Farmer' : 'Beginner Farmer'
            }));
          }
        }, 1200);
      };

      // KYC Submission
      const handleKycSubmit = (e) => {
        e.preventDefault();
        if (!aadhaarInput || aadhaarInput.length !== 12) {
          alert('Please provide a valid 12-digit Aadhaar Card number.');
          return;
        }

        setUser(prev => ({ ...prev, kycStatus: 'Pending' }));
        setKycRecords([...kycRecords, {
          id: kycRecords.length + 1,
          name: user.name,
          role: kycType,
          aadhaar: aadhaarInput,
          status: 'Pending'
        }]);
        alert('KYC Documents submitted successfully for review.');
      };

      // Admin Review Trigger
      const handleKycReview = (id, newStatus) => {
        setKycRecords(kycRecords.map(rec => rec.id === id ? { ...rec, status: newStatus } : rec));
        if (id === kycRecords.length) {
          setUser(prev => ({ ...prev, kycStatus: newStatus }));
        }
      };

      // Add Farmer crop listing
      const handleAddCrop = (e) => {
        e.preventDefault();
        if (!newCropName || !newCropPrice || !newCropQuantity) {
          alert('Please fill out all crop listing fields.');
          return;
        }

        const newCrop = {
          id: initialCrops.length + 3,
          cropName: newCropName,
          price: Number(newCropPrice),
          quantity: Number(newCropQuantity),
          unit: newCropUnit,
          farmer: user.name,
          location: newCropLocation || 'Local Farm',
          images: 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&q=80&w=250'
        };

        initialCrops.unshift(newCrop);
        setNewCropName('');
        setNewCropPrice('');
        setNewCropQuantity('');
        setNewCropLocation('');
        alert('Crop listing posted successfully to the marketplace.');
      };

      // Interactive Map Setup on Tab Mount
      useEffect(() => {
        if ((activeTab === 'tools' || activeTab === 'landing') && mapContainerRef.current) {
          // Initialize map only if not already initialized
          if (!mapInstance.current) {
            mapInstance.current = L.map(mapContainerRef.current).setView([28.6139, 77.2090], 11);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mapInstance.current);

            // Add markers for initialTools
            initialTools.forEach(tool => {
              L.marker(tool.location)
                .addTo(mapInstance.current)
                .bindPopup(`<b>${tool.name}</b><br/>Daily Rent: ₹${tool.rentRates.daily}<br/>Owner: ${tool.owner}`);
            });
          }
        }
      }, [activeTab]);

      // Cart utilities
      const addToCart = (product) => {
        setCart([...cart, product]);
        alert(`${product.name} added to cart!`);
      };

      const handleCheckout = () => {
        if (cart.length === 0) return;
        alert('Payment initiated via Razorpay Secure Sandbox. Processing ₹' + cart.reduce((acc, c) => acc + c.price, 0));
        setCart([]);
        setUser(prev => ({ ...prev, coins: prev.coins + 20, xp: prev.xp + 40 }));
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Main Top Header Navigation */}
          <nav className="fixed top-0 left-0 w-full z-50 glass-panel border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <div className="flex items-center gap-3">
                  <div className="h-10 w-10 bg-emerald-500/20 flex items-center justify-center rounded-xl border border-emerald-500/30">
                    <span className="text-2xl">🌱</span>
                  </div>
                  <div className="flex flex-col">
                    <span className="text-xl font-bold tracking-tight text-white">AgriRent <span className="text-primary-500">Hub</span></span>
                    <span className="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Startup Platform</span>
                  </div>
                </div>

                      </div>

                      <div className="h-48 flex items-center justify-center border border-slate-800 rounded-xl bg-slate-900/30">

                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Tab: Crop Price Prediction */}
            {activeTab === 'price' && (

                  <p className="text-xs text-slate-400">Predict future crop price trends based on historical Mandi analytics.</p>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {/* Inputs Column */}
                  <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4 h-fit">

                    <form onSubmit={handlePricePredict} className="space-y-4">
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Crop</label>
                        <select
                          value={priceInputs.crop} onChange={(e) => setPriceInputs({ ...priceInputs, crop: e.target.value })}

                          <option value="Wheat">Wheat (गेंहू)</option>
                          <option value="Rice">Rice (धान)</option>
                          <option value="Corn">Corn (मक्का)</option>
                          <option value="Soybean">Soybean (सोयाबीन)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-2">State</label>

                          value={priceInputs.state} onChange={(e) => setPriceInputs({ ...priceInputs, state: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-xs focus:outline-none focus:border-primary-500 text-slate-300"
                        >
                          <option value="Punjab">Punjab</option>
                          <option value="Haryana">Haryana</option>
                          <option value="Uttar Pradesh">Uttar Pradesh</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-2">District</label>
                        <input
                          type="text" required value={priceInputs.district}
                          onChange={(e) => setPriceInputs({ ...priceInputs, district: e.target.value })}

                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Harvest Season</label>

                          value={priceInputs.season} onChange={(e) => setPriceInputs({ ...priceInputs, season: e.target.value })}

                        >
                          <option value="Rabi">Rabi (Winter)</option>
                          <option value="Kharif">Kharif (Monsoon)</option>
                          <option value="Zaid">Zaid (Summer)</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 rounded-xl text-xs transition-colors shadow-lg">
                        Calculate Prediction
                      </button>
                    </form>
                  </div>

                  {/* Prediction Output Results */}
                  <div className="md:col-span-2 glass-panel p-6 rounded-2xl border border-slate-800 space-y-6">
                    <h3 className="text-base font-bold text-white border-b border-slate-800 pb-2">Prediction Analysis Report</h3>

                    {pricePrediction ? (
                      <div className="space-y-6 animate-fade-in">
                        <div className="grid grid-cols-3 gap-4">
                          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                            <p className="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Predicted (Quintal)</p>
                            <p className="text-lg font-bold text-emerald-400">₹{pricePrediction.expected}</p>
                          </div>
                          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                            <p className="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Minimum price</p>
                            <p className="text-sm font-bold text-slate-300">₹{pricePrediction.min}</p>
                          </div>
                          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                            <p className="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Maximum price</p>
                            <p className="text-sm font-bold text-slate-300">₹{pricePrediction.max}</p>
                          </div>
                        </div>

                        <div className="space-y-2 text-xs">
                          <p className="font-bold text-slate-300">Advisory Suggestions:</p>

                        </div>

                        {/* Visual Trend Chart Simulator using SVGs */}

                          <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 h-44 flex items-end justify-between px-6 pt-8">
                            {[
                              { m: 'Jan', v: '60%' },
                              { m: 'Feb', v: '65%' },
                              { m: 'Mar', v: '75%' },
                              { m: 'Apr', v: '85%' },
                              { m: 'May', v: '95%' },
                              { m: 'Jun', v: '100%' }

                                <span className="text-[10px] text-slate-500 font-bold">{item.m}</span>
                              </div>

                          </div>
                        </div>

                      <div className="space-y-3">
                        {quizQuestions[quizIndex].opts.map((opt, i) => (
                          <button
                            key={i}
                            onClick={() => submitQuizOption(opt)}
                            className={`w-full text-left p-4 rounded-xl text-xs font-semibold border transition-all ${selectedOption === opt ? 'bg-primary-500 border-primary-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700 hover:bg-slate-800'}`}
                          >
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>

                      <h3 className="text-xl font-bold text-white">Quiz Completed!</h3>
                      <p className="text-xs text-slate-400">You scored {quizScore} out of {quizQuestions.length} correct answers.</p>
                      
                      <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 inline-block text-left text-xs space-y-2">
                        <p className="text-slate-300">🪙 Earned: <span className="text-amber-400 font-bold">+{quizScore * 10 + 10} Agri Coins</span></p>
                        <p className="text-slate-300">⚡ XP Earned: <span className="text-primary-400 font-bold">+{quizScore * 20 + 20} XP Points</span></p>
                      </div>

                      <button
                        onClick={() => {
                          setQuizIndex(0);
                          setQuizScore(0);
                          setQuizFinished(false);
                          setSelectedOption(null);
                        }}
                        className="block w-full bg-primary-600 hover:bg-primary-700 text-white text-xs font-bold py-3 rounded-xl transition-colors"
                      >
                        Retake Quiz
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Tab: Chat */}
            {activeTab === 'chat' && (

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {/* Left Column: Direct Chats List */}
                  <div className="glass-panel rounded-2xl border border-slate-800 overflow-hidden h-[450px]">
                    <div className="p-4 border-b border-slate-800 bg-slate-900/50">

                    </div>
                    <div className="divide-y divide-slate-800">
                      <button className="w-full text-left p-4 hover:bg-slate-900/50 transition-colors flex items-center gap-3 bg-primary-500/5">
                        <span className="h-8 w-8 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-xs">RK</span>
                        <div>
                          <p className="text-xs font-bold text-white">Rajesh Kumar (Owner)</p>
                          <p className="text-[10px] text-slate-400">Online</p>
                        </div>
                      </button>
                    </div>
                  </div>

                  {/* Right Column: Chat Box */}
                  <div className="md:col-span-2 glass-panel rounded-2xl border border-slate-800 overflow-hidden flex flex-col h-[450px]">
                    {/* Header */}
                    <div className="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                      <div className="flex items-center gap-2">
                        <span className="h-6 w-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">RK</span>
                        <p className="text-xs font-bold text-white">Rajesh Kumar (Owner)</p>
                      </div>
                      <span className="text-[10px] bg-primary-500/10 text-primary-400 px-2 py-0.5 rounded font-bold">Mahindra Tractor</span>
                    </div>

                    {/* Messages Body */}
                    <div className="flex-grow p-4 overflow-y-auto space-y-4 scrollbar-hidden">
                      {chatLog.map((chat, idx) => (
                        <div key={idx} className={`flex ${chat.sender === 'Me' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-xs rounded-2xl p-3 text-xs ${chat.sender === 'Me' ? 'bg-primary-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-300 rounded-tl-none'}`}>
                            {chat.voiceNote ? (
                              <div className="flex items-center gap-2">
                                <span className="text-base">🎙️</span>
                                <div className="flex gap-0.5 items-center">
                                  <span className="h-4 w-1 bg-white rounded-full voice-bar"></span>
                                  <span className="h-5 w-1 bg-white rounded-full voice-bar" style={{ animationDelay: '0.2s' }}></span>
                                  <span className="h-3 w-1 bg-white rounded-full voice-bar" style={{ animationDelay: '0.4s' }}></span>
                                </div>
                                <span className="text-[10px] text-slate-200">Voice Note (0:08s)</span>
                              </div>
                            ) : (
                              <p>{chat.message}</p>
                            )}
                            <p className="text-[8px] text-slate-400 text-right mt-1">{chat.time}</p>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Chat footer input */}
                    <form onSubmit={sendChatMessage} className="p-3 bg-slate-900 border-t border-slate-800 flex gap-2 items-center">
                      <button type="button" onClick={sendVoiceNote} className="p-2 bg-slate-850 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs" title="Send Voice Note">
                        🎙️
                      </button>
                      <input
                        type="text"
                        value={chatInput}
                        onChange={(e) => setChatInput(e.target.value)}
                        placeholder="Write a message..."
                        className="flex-grow bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs focus:outline-none focus:border-primary-500"
                      />
                      <button type="submit" className="bg-primary-600 hover:bg-primary-700 text-white px-3 py-2 rounded-lg text-xs font-semibold">
                        Send
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* Tab: Dashboards (KYC reviews, user growth, revenue charts) */}
            {activeTab === 'dashboard' && (
              <div className="space-y-12 animate-fade-in">
                
                {/* KYC Verification Drawer */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  {/* Left Column: KYC submit */}
                  <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-6 h-fit">
                    <div>
                      <h3 className="text-lg font-bold text-white">KYC Verification Gate</h3>
                      <p className="text-xs text-slate-400 font-medium">Verify your profile credentials to unlocks bulk marketplaces.</p>
                    </div>

                    <form onSubmit={handleKycSubmit} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 uppercase mb-2">Role Type</label>
                        <select
                          value={kycType} onChange={(e) => setKycType(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-xs focus:outline-none"
                        >
                          <option value="Farmer">Farmer Aadhaar</option>
                          <option value="Tool Owner">Tool Owner Certification</option>
                          <option value="Shopkeeper">Shopkeeper Licenses</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 uppercase mb-2">Aadhaar Card Number</label>
                        <input
                          type="text" required placeholder="12-Digit ID" maxLength="12"
                          value={aadhaarInput} onChange={(e) => setAadhaarInput(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-xs focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 uppercase mb-2">Select Aadhaar Scan Image</label>
                        <div className="border border-slate-800 rounded-lg p-4 bg-slate-950 text-center text-xs text-slate-500 font-medium cursor-pointer">
                          Aadhaar_Card_Upload.jpg
                        </div>
                      </div>
                      
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-850 text-center">
                        <p className="text-[10px] text-slate-400">Current KYC Verification Status:</p>
                        <p className={`text-xs font-bold ${user.kycStatus === 'Approved' ? 'text-primary-500' : user.kycStatus === 'Pending' ? 'text-amber-400' : 'text-red-400'}`}>{user.kycStatus}</p>
                      </div>

                      <button type="submit" className="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 rounded-xl text-xs transition-colors">
                        Submit Documents
                      </button>
                    </form>
                  </div>

                  {/* Right Column: Admin review drawer */}
                  <div className="lg:col-span-2 glass-panel p-6 rounded-2xl border border-slate-800 space-y-6">
                    <div>
                      <h3 className="text-lg font-bold text-white">KYC Review Panel (Admin view)</h3>
                      <p className="text-xs text-slate-400">Review pending Aadhaar document requests.</p>
                    </div>

                    <div className="divide-y divide-slate-800">
                      {kycRecords.map(rec => (
                        <div key={rec.id} className="py-4 flex items-center justify-between text-xs">
                          <div>
                            <p className="font-bold text-white">{rec.name}</p>
                            <p className="text-[10px] text-slate-400">{rec.role} | Aadhaar: {rec.aadhaar}</p>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${rec.status === 'Approved' ? 'bg-primary-500/20 text-primary-400' : rec.status === 'Rejected' ? 'bg-red-500/20 text-red-400' : 'bg-amber-500/20 text-amber-400'}`}>{rec.status}</span>
                            {rec.status === 'Pending' && (
                              <div className="flex gap-1.5">
                                <button onClick={() => handleKycReview(rec.id, 'Approved')} className="bg-primary-600 hover:bg-primary-700 text-white font-medium px-2 py-1 rounded">Approve</button>
                                <button onClick={() => handleKycReview(rec.id, 'Rejected')} className="bg-red-600 hover:bg-red-700 text-white font-medium px-2 py-1 rounded">Reject</button>
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Dashboard Analytics Widgets */}
                <div className="space-y-6">
                  <h3 className="text-xl font-bold text-white">Platform Statistics & Analytics</h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center space-y-2">
                      <p className="text-xs text-slate-400 uppercase font-bold">Total Machinery Booked</p>
                      <p className="text-3xl font-extrabold text-primary-500">128 Hours</p>
                      <p className="text-[10px] text-slate-500">Equipment Utilization: 84.5%</p>
                    </div>
                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center space-y-2">
                      <p className="text-xs text-slate-400 uppercase font-bold">Mandi Revenue volume</p>
                      <p className="text-3xl font-extrabold text-white">₹48,250</p>
                      <p className="text-[10px] text-slate-500">Direct sales commission: 0%</p>
                    </div>
                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center space-y-2">
                      <p className="text-xs text-slate-400 uppercase font-bold">Active Shopkeeping Stock</p>
                      <p className="text-3xl font-extrabold text-white">192 Bags</p>
                      <p className="text-[10px] text-slate-500">Seeds & Fertilizers listed: 24 types</p>
                    </div>
                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center space-y-2">
                      <p className="text-xs text-slate-400 uppercase font-bold">Active Platform Users</p>
                      <p className="text-3xl font-extrabold text-primary-500">1,204 Farmers</p>
                      <p className="text-[10px] text-slate-500">Monthly user growth: +14.2%</p>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </div>

          {/* Toast notifications or Bottom bar */}
          <footer className="bg-slate-950 border-t border-slate-900 py-8 text-center text-slate-500 text-xs">
            <p>© 2026 AgriRent Hub. All rights reserved. Built as a startup-level AgriTech platform.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
